<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 · 浩海 study</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <!-- Supabase SDK：优先从本站加载（不依赖国外 CDN） -->
    <script src="vendor/supabase.js"></script>
    <script>window.supabase||document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>');</script>
    <script>
    document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
    document.addEventListener('keydown', function(e){
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','J','C','K'].indexOf(e.key) !== -1) || (e.ctrlKey && (e.key === 'u' || e.key === 'U'))) {
            e.preventDefault();
            return false;
        }
    });
    </script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'PingFang SC','Microsoft YaHei',sans-serif; margin: 0; padding: 0; min-height: 100vh; background: linear-gradient(135deg,#667eea,#764ba2); color: #333; }
        a { color: inherit; }
        .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 22px; background: rgba(255,255,255,.95); box-shadow: 0 2px 12px rgba(0,0,0,.08); position: sticky; top: 0; z-index: 10; flex-wrap: wrap; gap: 10px; }
        .brand { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: bold; color: #5b3bb5; }
        .brand img { width: 32px; height: 32px; }
        .brand .badge { font-size: 11px; background: linear-gradient(135deg,#7b2ff7,#f107a3); color: #fff; padding: 2px 8px; border-radius: 10px; font-weight: normal; }
        .topbar-right { display: flex; align-items: center; gap: 12px; font-size: 13px; }
        .topbar-right a, .topbar-right button { border: none; background: #f0eefe; color: #5b3bb5; padding: 7px 14px; border-radius: 16px; cursor: pointer; font-size: 13px; text-decoration: none; font-weight: bold; }
        .wrap { max-width: 1080px; margin: 22px auto; padding: 0 16px 60px; }

        /* 登录/无权限门 */
        .gate { max-width: 400px; margin: 90px auto; background: #fff; border-radius: 18px; padding: 30px; box-shadow: 0 12px 40px rgba(0,0,0,.18); text-align: center; }
        .gate h2 { margin: 0 0 8px; color: #5b3bb5; }
        .gate p { color: #666; font-size: 14px; line-height: 1.7; }
        .gate input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; margin: 8px 0; font-size: 14px; }
        .gate button { width: 100%; padding: 12px; border: none; border-radius: 10px; background: linear-gradient(135deg,#667eea,#764ba2); color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 6px; }
        .gate .msg { min-height: 20px; font-size: 13px; color: #d4380d; }
        .gate .home { display: inline-block; margin-top: 14px; color: #667eea; font-size: 13px; }

        /* 标签页 */
        .tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
        .tabs button { border: none; background: rgba(255,255,255,.35); color: #fff; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .tabs button.active { background: #fff; color: #5b3bb5; }
        .panel { display: none; }
        .panel.active { display: block; }

        /* 统计卡片 */
        .cards { display: grid; grid-template-columns: repeat(auto-fit,minmax(160px,1fr)); gap: 14px; }
        .card { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 6px 20px rgba(0,0,0,.1); }
        .card .num { font-size: 30px; font-weight: bold; color: #5b3bb5; }
        .card .label { font-size: 13px; color: #888; margin-top: 6px; }
        .card .sub { font-size: 11px; color: #aaa; margin-top: 4px; }
        .card.c1 .num { color: #1890ff; }
        .card.c2 .num { color: #52c41a; }
        .card.c3 .num { color: #fa8c16; }
        .card.c4 .num { color: #eb2f96; }

        .box { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 6px 20px rgba(0,0,0,.1); margin-top: 16px; }
        .box h3 { margin: 0 0 14px; color: #5b3bb5; font-size: 16px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #f0f0f0; word-break: break-all; }
        th { color: #888; font-weight: normal; }
        .tag { padding: 2px 8px; border-radius: 10px; font-size: 11px; }
        .tag.ok { background: #e8ffea; color: #389e0d; }
        .tag.down { background: #fff1f0; color: #cf1322; }
        .op { border: none; padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 12px; margin-right: 5px; }
        .op.down { background: #fff1f0; color: #cf1322; }
        .op.restore { background: #e8ffea; color: #389e0d; }
        .op.del { background: #f5f5f5; color: #999; }
        .empty { text-align: center; color: #aaa; padding: 30px; font-size: 14px; }
        .loading { text-align: center; color: #888; padding: 30px; }
        .top-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f5f5f5; font-size: 13px; }
        .top-item .bar { height: 8px; background: linear-gradient(90deg,#667eea,#764ba2); border-radius: 4px; min-width: 2px; }
        .top-item .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .top-item .vn { color: #888; font-size: 12px; }
        .refresh { border: none; background: #5b3bb5; color: #fff; padding: 8px 16px; border-radius: 16px; cursor: pointer; font-size: 13px; float: right; }
        .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
        .filters button { border: none; background: #f0eefe; color: #5b3bb5; padding: 7px 14px; border-radius: 16px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .filters button.active { background: #5b3bb5; color: #fff; }
        .tag.mid { background: #fff7e6; color: #d46b08; }
        .sub-line { color: #999; font-size: 11px; margin-top: 3px; }
        .preview-text { text-align: left; color: #444; font-size: 14px; line-height: 1.9; white-space: pre-wrap; word-break: break-word; width: 100%; }
        @media (max-width: 600px) {
            .num { font-size: 24px; }
            .wrap { margin: 14px auto; }
            th, td { padding: 8px 4px; font-size: 12px; }
        }
        /* 自定义确认弹窗（替代浏览器原生 confirm 黑框） */
        #confirm-modal { display: none; position: fixed; inset: 0; z-index: 10020; background: rgba(0,0,0,.5); align-items: center; justify-content: center; padding: 16px; backdrop-filter: blur(4px); }
        .confirm-box { background: #fff; width: 100%; max-width: 380px; border-radius: 16px; padding: 24px; box-shadow: 0 16px 48px rgba(0,0,0,.28); animation: popIn .25s ease; text-align: center; }
        .confirm-icon { width: 60px; height: 60px; border-radius: 50%; background: #fff1f0; color: #e74c3c; display: flex; align-items: center; justify-content: center; font-size: 30px; margin: 0 auto 16px; }
        .confirm-title { font-size: 17px; font-weight: bold; color: #222; margin-bottom: 8px; }
        .confirm-msg { font-size: 14px; color: #666; line-height: 1.7; margin-bottom: 22px; word-break: break-word; }
        .confirm-btns { display: flex; gap: 12px; }
        .confirm-btns button { flex: 1; padding: 11px 0; border: none; border-radius: 9px; font-size: 14px; font-weight: bold; cursor: pointer; transition: filter .2s; }
        .confirm-btns button:hover { filter: brightness(.95); }
        .confirm-cancel { background: #f0f2f5; color: #555; }
        .confirm-ok { background: #5b3bb5; color: #fff; }
        .confirm-ok.danger { background: linear-gradient(135deg, #ff6b6b, #e74c3c); }
        @keyframes popIn { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        /* 界面内提示 Toast（替代浏览器原生 alert 黑框） */
        #toast-wrap { position: fixed; top: 78px; right: 18px; z-index: 10030; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; pointer-events: none; }
        .toast { min-width: 220px; max-width: min(380px, 90vw); background: #fff; border-radius: 12px; padding: 13px 16px; box-shadow: 0 10px 32px rgba(0,0,0,.18); border-left: 4px solid #5b3bb5; display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 1.6; color: #333; animation: toastIn .28s ease; pointer-events: auto; word-break: break-word; }
        .toast.ok { border-left-color: #28a745; }
        .toast.err { border-left-color: #e74c3c; }
        .toast.info { border-left-color: #5b3bb5; }
        .toast .ti { font-size: 18px; line-height: 1.2; flex: none; }
        .toast.ok .ti { color: #28a745; }
        .toast.err .ti { color: #e74c3c; }
        .toast.info .ti { color: #5b3bb5; }
        .toast.out { animation: toastOut .3s ease forwards; }
        @keyframes toastIn { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes toastOut { to { transform: translateX(30px); opacity: 0; } }
        /* 管理端内容预览弹窗 */
        .op.view { background: #e6f4ff; color: #0958d9; }
        #preview-modal { display: none; position: fixed; inset: 0; z-index: 10025; background: rgba(0,0,0,.72); align-items: center; justify-content: center; padding: 16px; backdrop-filter: blur(4px); }
        .preview-box { background: #fff; width: 100%; max-width: 860px; max-height: 92vh; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 16px 48px rgba(0,0,0,.3); animation: popIn .25s ease; }
        .preview-head { padding: 14px 18px; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex: none; }
        .preview-head .pt { font-weight: bold; font-size: 15px; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .preview-head .px { cursor: pointer; font-size: 24px; color: #999; line-height: 1; flex: none; }
        .preview-body { flex: 1; overflow: auto; background: #f5f6f8; display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; min-height: 240px; padding: 16px; }
        .preview-body img { max-width: 100%; max-height: 72vh; object-fit: contain; border-radius: 8px; }
        .preview-body iframe { width: 100%; height: 72vh; border: none; background: #fff; }
        .preview-fallback { text-align: center; color: #666; line-height: 2; }
        .preview-fallback a { display: inline-block; margin-top: 10px; padding: 10px 20px; background: #5b3bb5; color: #fff; border-radius: 8px; text-decoration: none; }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="brand"><img src="favicon.svg" alt="logo">浩海 study <span class="badge">管理后台</span></div>
        <div class="topbar-right" id="topbar-right" style="display:none;">
            <span id="admin-email"></span>
            <a href="index.html">返回网站</a>
            <button onclick="doLogout()">退出登录</button>
        </div>
    </div>

    <!-- 门禁：未登录或非管理员 -->
    <div class="gate" id="gate">
        <h2>🔐 管理员登录</h2>
        <p>该页面仅管理员可访问。请使用管理员邮箱登录。</p>
        <input type="email" id="email" placeholder="管理员邮箱">
        <input type="password" id="password" placeholder="密码">
        <div class="msg" id="gate-msg"></div>
        <button id="login-btn" onclick="adminLogin()">登录验证</button>
        <a class="home" href="index.html">← 返回网站首页</a>
    </div>

    <!-- 后台主体 -->
    <div class="wrap" id="main" style="display:none;">
        <div class="tabs">
            <button class="active" data-tab="stats" onclick="switchTab('stats')">📊 数据统计</button>
            <button data-tab="items" onclick="switchTab('items')">📋 内容巡查</button>
            <button data-tab="users" onclick="switchTab('users')">👥 注册用户</button>
        </div>

        <!-- 统计 -->
        <div class="panel active" id="panel-stats">
            <button class="refresh" onclick="loadStats()">🔄 刷新</button>
            <div class="cards" id="stat-cards">
                <div class="card"><div class="num">-</div><div class="label">加载中…</div></div>
            </div>
            <div class="box">
                <h3>🔥 最受欢迎的内容（按查看/下载次数）</h3>
                <div id="top-list"><div class="loading">加载中…</div></div>
            </div>
        </div>

        <!-- 内容巡查 -->
        <div class="panel" id="panel-items">
            <button class="refresh" onclick="loadItems()">🔄 刷新</button>
            <div class="box">
                <h3>内容巡查（含已下架）</h3>
                <div class="filters" id="item-filters">
                    <button class="active" data-type="all" onclick="setItemFilter('all')">全部</button>
                    <button data-type="doc" onclick="setItemFilter('doc')">📚 资料</button>
                    <button data-type="comp" onclick="setItemFilter('comp')">🏆 比赛</button>
                    <button data-type="scenery" onclick="setItemFilter('scenery')">🌸 美景</button>
                    <button data-type="course" onclick="setItemFilter('course')">🎓 课程</button>
                    <button data-type="lostfound" onclick="setItemFilter('lostfound')">🔍 失物</button>
                    <button data-type="team" onclick="setItemFilter('team')">🤝 组队</button>
                </div>
                <div id="items-list"><div class="loading">加载中…</div></div>
            </div>
        </div>

        <!-- 用户 -->
        <div class="panel" id="panel-users">
            <button class="refresh" onclick="loadUsers()">🔄 刷新</button>
            <div class="box">
                <h3>注册用户列表</h3>
                <div id="users-list"><div class="loading">加载中…</div></div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ihvusuaeksxynxewcmjs.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_NrbDiThGb-gPPSAVmVZXyA_PXXBslVc';
        const ADMIN_EMAIL = '2984054909@qq.com';
        const supabaseClient = (typeof supabase !== 'undefined' && supabase.createClient)
            ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

        function msg(t) { document.getElementById('gate-msg').textContent = t || ''; }
        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
        function fmtDate(s) { if (!s) return '-'; const d = new Date(s); return isNaN(d) ? '-' : d.toLocaleDateString('zh-CN'); }

        // ==========================================
        // 界面内提示 Toast：覆盖原生 alert，所有 alert() 自动变成界面提示
        // ==========================================
        function showToast(message, type) {
            type = type || 'info';
            const wrap = document.getElementById('toast-wrap');
            if (!wrap) { return; }
            const el = document.createElement('div');
            el.className = 'toast ' + type;
            const icon = type === 'ok' ? '✓' : (type === 'err' ? '!' : 'i');
            el.innerHTML = '<span class="ti">' + icon + '</span><span class="tx"></span>';
            el.querySelector('.tx').textContent = String(message == null ? '' : message);
            wrap.appendChild(el);
            const close = () => {
                if (el.classList.contains('out')) return;
                el.classList.add('out');
                setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
            };
            el.addEventListener('click', close);
            setTimeout(close, type === 'err' ? 5200 : 3200);
        }
        window.alert = function (message) {
            const s = String(message == null ? '' : message);
            const t = /失败|错误|缺少|不能|超时|未加载|没有|不支持|填写|不可用/.test(s) ? 'err'
                    : /成功|已保存|欢迎|完成/.test(s) ? 'ok' : 'info';
            showToast(s, t);
        };

        // 自定义确认弹窗：替代浏览器原生 confirm 黑框
        function askConfirm(message, opts) {
            opts = opts || {};
            return new Promise(resolve => {
                const modal = document.getElementById('confirm-modal');
                const iconEl = document.getElementById('confirm-icon');
                const titleEl = document.getElementById('confirm-title');
                const msgEl = document.getElementById('confirm-msg');
                const okBtn = document.getElementById('confirm-ok');
                const cancelBtn = document.getElementById('confirm-cancel');
                if (!modal) { resolve(window.confirm(message)); return; }
                iconEl.textContent = opts.icon || '🗑️';
                titleEl.textContent = opts.title || '确定操作？';
                msgEl.textContent = message || '';
                okBtn.textContent = opts.okText || '确定';
                cancelBtn.textContent = opts.cancelText || '取消';
                okBtn.className = 'confirm-ok' + (opts.danger === false ? '' : ' danger');
                modal.style.display = 'flex';
                const finish = val => {
                    modal.style.display = 'none';
                    okBtn.onclick = null; cancelBtn.onclick = null; modal.onclick = null;
                    document.removeEventListener('keydown', onKey);
                    resolve(val);
                };
                const onKey = e => {
                    if (e.key === 'Escape') finish(false);
                    else if (e.key === 'Enter') finish(true);
                };
                okBtn.onclick = () => finish(true);
                cancelBtn.onclick = () => finish(false);
                modal.onclick = e => { if (e.target === modal) finish(false); };
                document.addEventListener('keydown', onKey);
                okBtn.focus();
            });
        }

        // 超时保护：网络卡住时不再永远停在"登录中"
        function withTimeout(promise, ms, label) {
            return Promise.race([
                promise,
                new Promise((_, reject) => setTimeout(() => reject(new Error((label || '请求') + '超时，请检查网络后重试')), ms))
            ]);
        }

        async function getToken() {
            if (!supabaseClient || !supabaseClient.auth) return '';
            const { data } = await supabaseClient.auth.getSession();
            return (data && data.session && data.session.access_token) || '';
        }

        // 调用管理接口（自动带 token）
        async function api(action, method, body) {
            const token = await getToken();
            const opt = { method: method || 'GET', headers: { 'X-User-Token': token } };
            if (body) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
            const res = await withTimeout(fetch('/api/admin?action=' + encodeURIComponent(action), opt), 15000, '服务器请求');
            let data;
            try { data = await res.json(); } catch (_) { data = {}; }
            if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
            return data;
        }

        // 管理员登录
        async function adminLogin() {
            const email = (document.getElementById('email').value || '').trim();
            const password = document.getElementById('password').value || '';
            if (!email || !password) { msg('请填写邮箱和密码'); return; }
            if (email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) { msg('该邮箱不是管理员账号'); return; }
            if (!supabaseClient) { msg('登录组件未加载，请刷新页面'); return; }
            msg('登录中…');
            const loginBtn = document.getElementById('login-btn');
            if (loginBtn) loginBtn.disabled = true;
            try {
                const { data, error } = await withTimeout(
                    supabaseClient.auth.signInWithPassword({ email, password }), 20000, '登录'
                );
                if (error) throw error;
                if (!data.session) throw new Error('登录未返回会话');
                msg('登录成功，正在进入…');
                await bootstrap();
            } catch (e) {
                const m = String(e && e.message || '');
                let tip;
                if (/超时|timeout|fetch|network/i.test(m)) tip = '网络不稳定，连接登录服务器超时。请检查网络后重试（多试几次，或换个网络环境）';
                else if (/email not confirmed|not confirmed|confirm/i.test(m)) tip = '邮箱还没验证，请去注册邮箱点一下 Supabase 发来的确认链接，再回来登录';
                else if (/invalid login credentials|invalid.*password|bad credentials/i.test(m)) tip = '邮箱或密码错误，请检查后重试';
                else tip = m || '请检查邮箱和密码';
                msg('登录失败：' + tip);
            } finally {
                if (loginBtn) loginBtn.disabled = false;
            }
        }

        async function doLogout() {
            try { if (supabaseClient) await supabaseClient.auth.signOut(); } catch (_) {}
            location.reload();
        }

        // 启动时校验身份
        async function bootstrap() {
            const token = await getToken();
            if (!token) { showGate(); return; }
            let check;
            try { check = await api('check'); }
            catch (e) { showGate(); return; }
            if (!check.isAdmin) {
                const d = check.debug || {};
                let reason;
                if (!check.email) {
                    reason = '没读到账号邮箱';
                    if (!d.hasServiceRole) reason += '（服务端未配置 SUPABASE_SERVICE_ROLE）';
                    else if (!d.hasUserId) reason += '（登录凭证无效）';
                } else {
                    reason = '邮箱 ' + check.email + ' 不在管理员白名单';
                }
                let detail = '无权访问：' + reason + '。请用管理员邮箱 2984054909@qq.com 登录。';
                if (Array.isArray(d.envKeys)) {
                    detail += ' [后端已读变量: ' + (d.envKeys.length ? d.envKeys.join(', ') : '无') + ']';
                }
                document.getElementById('gate').querySelector('p').textContent = detail;
                showGate();
                return;
            }
            document.getElementById('gate').style.display = 'none';
            document.getElementById('main').style.display = 'block';
            document.getElementById('topbar-right').style.display = 'flex';
            document.getElementById('admin-email').textContent = '👤 ' + esc(check.email);
            loadStats();
        }

        function showGate() {
            document.getElementById('gate').style.display = 'block';
            document.getElementById('main').style.display = 'none';
            document.getElementById('topbar-right').style.display = 'none';
        }

        function switchTab(tab) {
            document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById('panel-' + tab).classList.add('active');
            if (tab === 'stats') loadStats();
            if (tab === 'items') loadItems();
            if (tab === 'users') loadUsers();
        }

        // ===== 统计 =====
        async function loadStats() {
            const box = document.getElementById('stat-cards');
            box.innerHTML = '<div class="card"><div class="num">-</div><div class="label">加载中…</div></div>';
            try {
                const d = await api('stats');
                const s = d.stats || {};
                const cards = [
                    ['c1', s.contentTotal, '内容总数', `资料 ${s.docCount||0} · 比赛 ${s.compCount||0} · 美景 ${s.sceneryCount||0} · 课程 ${s.courseCount||0} · 失物 ${s.lostfoundCount||0} · 组队 ${s.teamCount||0}`],
                    ['c2', s.userCount, '注册用户', '已注册的账号数'],
                    ['c3', s.visitTotal, '网站访问量', `今日 ${s.visitToday||0} 次`],
                    ['c4', s.aiTotal, 'AI 提问次数', `今日 ${s.aiToday||0} 次`]
                ];
                box.innerHTML = cards.map(c => `<div class="card ${c[0]}"><div class="num">${c[1]}</div><div class="label">${c[2]}</div><div class="sub">${c[3]}</div></div>`).join('') +
                    `<div class="card"><div class="num">${s.downloadTotal||0}</div><div class="label">下载/查看次数</div><div class="sub">今日 ${s.downloadToday||0} 次</div></div>` +
                    `<div class="card"><div class="num">${s.takedownCount||0}</div><div class="label">已下架内容</div><div class="sub">资料 / 课程 / 失物 / 组队</div></div>`;

                const tops = d.topItems || [];
                const maxV = tops.reduce((a, x) => Math.max(a, x.views || 0), 1);
                const kindName = { doc:'📚资料', comp:'🏆比赛', scenery:'🌸美景' };
                document.getElementById('top-list').innerHTML = tops.length
                    ? tops.map(t => `<div class="top-item"><span class="nm">${esc(kindName[t.kind]||t.kind)} ${esc(t.name||'未命名')}</span><span class="bar" style="width:${Math.max(2,(t.views||0)/maxV*120)}px"></span><span class="vn">${t.views||0} 次</span></div>`).join('')
                    : '<div class="empty">暂无查看记录</div>';
            } catch (e) {
                box.innerHTML = '<div class="card"><div class="label" style="color:#cf1322">加载失败：' + esc(e.message) + '</div></div>';
            }
        }

        // ===== 内容巡查 =====
        let itemFilter = 'all';
        let allItems = [];
        const TYPE_LABEL = { doc:'📚 资料', comp:'🏆 比赛', scenery:'🌸 美景', course:'🎓 课程', lostfound:'🔍 失物', team:'🤝 组队' };

        function statusTag(it) {
            if (it.status === 'takedown' || it.status === 'hidden') return '<span class="tag down">已下架</span>';
            if (it.type === 'lostfound') {
                if (it.status === 'resolved') return '<span class="tag ok">已找回</span>';
                if (it.status === 'closed') return '<span class="tag mid">已关闭</span>';
                return '<span class="tag ok">寻找中</span>';
            }
            if (it.type === 'team') {
                if (it.status === 'closed') return '<span class="tag mid">已关闭</span>';
                return '<span class="tag ok">招募中</span>';
            }
            return '<span class="tag ok">公开</span>';
        }

        async function loadItems() {
            const box = document.getElementById('items-list');
            box.innerHTML = '<div class="loading">加载中…</div>';
            try {
                const d = await api('items');
                allItems = d.items || [];
                window.__adminItems = allItems;   // 缓存供预览弹窗按 type + id 查找
                renderItems();
            } catch (e) {
                box.innerHTML = '<div class="empty" style="color:#cf1322">加载失败：' + esc(e.message) + '</div>';
            }
        }

        function setItemFilter(type) {
            itemFilter = type || 'all';
            document.querySelectorAll('#item-filters button').forEach(function (b) {
                b.classList.toggle('active', b.getAttribute('data-type') === itemFilter);
            });
            renderItems();
        }

        function renderItems() {
            const box = document.getElementById('items-list');
            const items = allItems.filter(function (it) {
                return itemFilter === 'all' || it.type === itemFilter;
            });
            if (!items.length) {
                box.innerHTML = '<div class="empty">这个分类下暂无内容</div>';
                return;
            }
            box.innerHTML = '<table><thead><tr><th>类型</th><th>名称</th><th>发布者</th><th>状态</th><th>时间</th><th>操作</th></tr></thead><tbody>' +
                items.map(function (it) {
                    const name = it.title || '未命名';
                    const sub = it.subtitle ? '<div class="sub-line">' + esc(it.subtitle) + '</div>' : '';
                    const down = it.status === 'takedown' || it.status === 'hidden';
                    const op = down
                        ? `<button class="op restore" onclick="moderate('restore','${it.type}',${Number(it.id)})">恢复</button>`
                        : `<button class="op down" onclick="moderate('takedown','${it.type}',${Number(it.id)})">下架</button>`;
                    return `<tr><td>${TYPE_LABEL[it.type] || it.type}</td>` +
                        `<td>${esc(name)}${sub}</td>` +
                        `<td>${esc(it.owner || '平台')}</td>` +
                        `<td>${statusTag(it)}</td>` +
                        `<td>${fmtDate(it.created_at)}</td>` +
                        `<td><button class="op view" onclick="previewItem('${it.type}',${Number(it.id)})">预览</button>${op}` +
                        `<button class="op del" onclick="moderate('delete','${it.type}',${Number(it.id)})">删除</button></td></tr>`;
                }).join('') + '</tbody></table>';
        }

        async function moderate(action, type, id) {
            const names = { takedown: '下架', restore: '恢复公开', delete: '删除' };
            const isDelete = action === 'delete';
            const opts = isDelete
                ? { title: '确定删除？', okText: '确定删除', icon: '🗑️', danger: true }
                : { title: '确定' + names[action] + '？', okText: '确定' + names[action], icon: action === 'restore' ? '♻️' : '⬇️', danger: false };
            const verb = isDelete ? '删除后无法恢复' : (action === 'restore' ? '恢复后所有人都能看到' : '下架后用户将无法看到');
            if (!await askConfirm('确定要「' + names[action] + '」这条内容吗？' + verb + '。', opts)) return;
            try {
                await api('moderate', 'POST', { action, type, id });
                loadItems();
                loadStats();
            } catch (e) { alert('操作失败：' + e.message); }
        }

        // ===== 管理端内容预览（不用跳回用户界面） =====
        function safeUrl(u) {
            const s = String(u || '').trim();
            return /^(https?:\/\/|\/)/i.test(s) ? s : '';
        }
        function previewItem(type, id) {
            const items = window.__adminItems || [];
            const it = items.find(x => String(x.type) === String(type) && String(x.id) === String(id));
            if (!it) { alert('未找到该内容，请刷新列表后重试'); return; }
            const title = it.title || '未命名';
            const modal = document.getElementById('preview-modal');
            document.getElementById('preview-title').textContent = title;
            const body = document.getElementById('preview-body');

            if (type === 'course' || type === 'team') {
                body.innerHTML = '<div class="preview-text">' + esc(it.desc || '暂无介绍') + '</div>';
            } else if (type === 'lostfound') {
                const img = it.link ? '<img src="' + esc(safeUrl(it.link)) + '" alt="失物照片">' : '';
                body.innerHTML = img + '<div class="preview-text">' + esc(it.desc || '暂无描述') + '</div>';
            } else {
                const url = safeUrl(it.link);
                if (!url) {
                    body.innerHTML = '<div class="preview-fallback">该内容没有可预览的链接。<br>仅登记了文字信息，没有上传文件。</div>';
                } else {
                    const isImg = type === 'scenery' || /\.(png|jpe?g|gif|webp|bmp)(\?|$)/i.test(url);
                    const isPdf = /\.(pdf)(\?|$)/i.test(url) || /\/file\/[^/]+/i.test(url);
                    if (isImg) {
                        body.innerHTML = '<img src="' + esc(url) + '" alt="' + esc(title) + '">';
                    } else if (isPdf) {
                        body.innerHTML = '<iframe src="' + esc(url) + '#toolbar=1" title="' + esc(title) + '"></iframe>';
                    } else {
                        body.innerHTML = '<div class="preview-fallback">此类型无法内嵌预览。<br><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">在新标签打开 ↗</a></div>';
                    }
                }
            }
            modal.style.display = 'flex';
        }
        function closePreview() {
            const m = document.getElementById('preview-modal');
            if (m) { m.style.display = 'none'; document.getElementById('preview-body').innerHTML = ''; }
        }
        // 预览弹窗：点遮罩关闭 + Esc 关闭（懒绑定，等 DOM 就绪）
        document.addEventListener('DOMContentLoaded', function () {
            const m = document.getElementById('preview-modal');
            if (m) m.addEventListener('click', function (e) { if (e.target === m) closePreview(); });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') {
                    const pm = document.getElementById('preview-modal');
                    if (pm && pm.style.display === 'flex') closePreview();
                }
            });
        });

        // ===== 用户 =====
        async function loadUsers() {
            const box = document.getElementById('users-list');
            box.innerHTML = '<div class="loading">加载中…</div>';
            try {
                const d = await api('users');
                const users = d.users || [];
                if (!users.length) { box.innerHTML = '<div class="empty">暂无注册用户</div>'; return; }
                box.innerHTML = '<table><thead><tr><th>邮箱</th><th>注册时间</th><th>最近登录</th></tr></thead><tbody>' +
                    users.map(u => `<tr><td>${esc(u.email)}</td><td>${fmtDate(u.created_at)}</td><td>${fmtDate(u.last_sign_in_at)}</td></tr>`).join('') +
                    '</tbody></table>';
            } catch (e) {
                box.innerHTML = '<div class="empty" style="color:#cf1322">加载失败：' + esc(e.message) + '</div>';
            }
        }

        bootstrap();
    </script>

    <!-- 界面内提示容器 -->
    <div id="toast-wrap" aria-live="polite"></div>

    <!-- 管理端内容预览弹窗 -->
    <div id="preview-modal" role="dialog" aria-modal="true" aria-labelledby="preview-title">
        <div class="preview-box">
            <div class="preview-head">
                <div class="pt" id="preview-title">预览</div>
                <div class="px" onclick="closePreview()">×</div>
            </div>
            <div class="preview-body" id="preview-body"></div>
        </div>
    </div>

    <!-- 自定义确认弹窗 -->
    <div id="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
        <div class="confirm-box">
            <div class="confirm-icon" id="confirm-icon">🗑️</div>
            <div class="confirm-title" id="confirm-title">确定操作？</div>
            <div class="confirm-msg" id="confirm-msg"></div>
            <div class="confirm-btns">
                <button class="confirm-cancel" id="confirm-cancel">取消</button>
                <button class="confirm-ok danger" id="confirm-ok">确定</button>
            </div>
        </div>
    </div>
</body>
</html>
